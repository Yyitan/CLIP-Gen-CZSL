dataset:
  dataset: cgqa
  feat_dim: 768
  d_c: 512
  d_z: 512
  adapter_ratio: 0.0

generator:
  epochs: 100
  batch_size: 1024
  lr_g: 0.0001
  lr_d: 0.0001
  n_critic: 5
  lambda_gp: 10.0
  lambda_r: 1.0
  lambda_kl: 0.1
  lambda_clip: 0.3
  lambda_dis: 0.5
  lambda_cyc: 0.2
  lambda_div: 0.1
  clip_tau: 0.07
  use_cycle: true
  cycle_start_ratio: 0.4
  save_every: 10

classifier:
  k_syn: 300
  epochs_clf: 30
  batch_size: 2048
  lr_clf: 0.001

eval:
  open_world: true
  threshold: 0.4228
  eval_batch_size: 512
